name: ci

on:
  # push only. Every branch here is pushed directly to this repo, so the push
  # event already covers any branch a PR is opened from -- `pull_request:` was
  # alongside this until 2026-08 and did nothing but run the whole workflow a
  # second time on those branches. It earns its place only for pull requests
  # from forks, which do not happen on a private single-owner dotfiles repo.
  push:
    branches: ["**"]
  workflow_dispatch:

# Push twice in quick succession and only the newer run matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, no editor required. Catches the two classes of mistake this repo has
  # actually made: mappings that silently override each other, and editor
  # state getting committed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck setup.sh
        run: shellcheck setup.sh

      - name: keymap collisions
        run: ./scripts/check-keymaps.py

      - name: no editor state is tracked
        # Regression test for the 2026-08 history scrub. Swap files, a ctags
        # index and netrw bookmarks were all committed at some point and
        # carried for years. .gitignore covers them now; this fails the build
        # if one is ever force-added past it.
        run: |
          bad=$(git ls-files | grep -E \
            '(^|/)(swapfiles|backupfiles|session)/|\.(swp|swo|un~)$|(^|/)\.vimtags$|(^|/)\.netrw(hist|book)$|(^|/)tags$|:Zone\.Identifier$|\.DS_Store$' \
            || true)
          if [ -n "$bad" ]; then
            echo "editor state is tracked in git:"; echo "$bad"; exit 1
          fi
          echo "clean"

      - name: no absolute home paths in tracked files
        # The swap files leaked /Users/<name>/... paths. Nothing tracked here
        # should carry one; $HOME belongs in the config instead.
        run: |
          bad=$(git grep -InE '/(Users|home)/[A-Za-z0-9._-]+/' -- . ':!README.md' || true)
          if [ -n "$bad" ]; then
            echo "absolute home paths found:"; echo "$bad"; exit 1
          fi
          echo "clean"

  # The one that matters. Installs everything and boots nvim for real.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable gates the build. nightly is an early-warning lane: it tells
        # us a coming neovim release breaks this config without turning the
        # branch red for something no commit here caused.
        neovim: [stable, nightly]
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install ctags and ripgrep
        run: sudo apt-get update && sudo apt-get install -y universal-ctags ripgrep

      - name: run setup.sh from the path the config expects
        # The config locates itself via stdpath('config') and the clone must be
        # named gitnvim, so the checkout has to be moved into the neovim config
        # directory before any of this means anything. XDG_CONFIG_HOME is unset
        # here, so that is ~/.config/nvim; a later step repeats this with the
        # variable set, to prove both resolve the same way.
        run: |
          mkdir -p ~/.config/nvim
          cp -r "$GITHUB_WORKSPACE" ~/.config/nvim/gitnvim
          cd ~/.config/nvim/gitnvim
          ./setup.sh

      - name: verify setup.sh is idempotent
        run: |
          cd ~/.config/nvim/gitnvim
          ./setup.sh --check

      - name: install plugins
        # No `|| true` on the sync: these are git clones, and a failure here
        # used to be swallowed, leaving the assertions below to fail with a
        # much less obvious message.
        run: nvim --headless "+Lazy! sync" +qa

      - name: install coc extensions
        # This one stays tolerant on purpose -- it reaches npm, and a registry
        # hiccup is not a config regression. What it does not get to do is
        # hide a missing coc: ci-assert.vim checks for :CocList separately.
        # coc also pulls this list itself from vim.g.coc_global_extensions on
        # first start; this just front-loads it.
        run: nvim --headless "+CocInstall -sync coc-json coc-tsserver" +qa || true

      - name: startup produces no errors
        # An error during startup is the failure mode this repo has hit: nvim
        # still exits 0, so the exit code proves nothing. Check stderr.
        run: |
          nvim --headless +qa 2>startup.err
          if [ -s startup.err ]; then
            echo "nvim wrote to stderr during startup:"; cat startup.err; exit 1
          fi
          echo "clean startup"

      - name: load-order assertions
        run: |
          cd ~/.config/nvim/gitnvim
          nvim --headless -S scripts/ci-assert.vim +qa

      - name: config follows XDG_CONFIG_HOME
        # setup.sh honoured XDG_CONFIG_HOME while .vimrc hardcoded
        # ~/.config/nvim, so setting the variable installed the config to one
        # place and made nvim look for it in another -- with `--check`
        # reporting that everything passed. Both halves go through the same
        # resolution now; this proves they agree. Plugins live under
        # XDG_DATA_HOME, which is untouched, so nothing reinstalls here.
        env:
          XDG_CONFIG_HOME: /tmp/xdg-config
        run: |
          mkdir -p "$XDG_CONFIG_HOME/nvim"
          cp -r "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim/gitnvim"
          cd "$XDG_CONFIG_HOME/nvim/gitnvim"
          ./setup.sh
          ./setup.sh --check
          nvim --headless -S scripts/ci-assert.vim +qa

      - name: the assertions actually fail when the config breaks
        # An assertion harness that has never been observed to fail is not yet
        # known to work, and this one has been green since the day it landed.
        # Break one thing it checks -- the last mapping in legacy.vim -- and
        # require it to notice. `-S` is just `-c source`, so both run after
        # init.lua has finished.
        run: |
          cd ~/.config/nvim/gitnvim
          if nvim --headless -c 'nunmap <leader>ca' -S scripts/ci-assert.vim +qa 2>/dev/null; then
            echo "ci-assert.vim passed with <leader>ca unmapped -- the tripwires are not wired up"
            exit 1
          fi
          echo "tripwire fires as expected"
