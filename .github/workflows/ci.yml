name: ci

on:
  # push only. Everything here is pushed directly to this repo, so the push
  # event already covers any branch a PR is opened from -- `pull_request:` sat
  # alongside this until 2026-08 and did nothing but run the whole thing twice.
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # One job, no editor. Every check below is a regression test for something
  # that actually went wrong in this repo -- that is the bar for adding
  # another. A smoke job that installed neovim and booted it lived here
  # briefly; see README for why it went and what runs by hand instead.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck setup.sh
        run: shellcheck setup.sh

      - name: keymap collisions
        # mapleader is <space>, so every <space>x mapping is a <leader>x
        # mapping in disguise -- which is how <space>a shadowed <leader>a for
        # years with no error. Reads .vimrc and lua/init.lua both, because a
        # collision can span the two and neither file shows both sides.
        run: ./scripts/check-keymaps.py

      - name: no editor state is tracked
        # Regression test for the 2026-08 history scrub. Swap files, a ctags
        # index and netrw bookmarks were all committed at some point and
        # carried for years. .gitignore covers them now; this fails the build
        # if one is ever force-added past it.
        run: |
          bad=$(git ls-files | grep -E \
            '(^|/)(swapfiles|backupfiles|session)/|\.(swp|swo|un~)$|(^|/)\.vimtags$|(^|/)\.netrw(hist|book)$|(^|/)tags$|:Zone\.Identifier$|\.DS_Store$' \
            || true)
          if [ -n "$bad" ]; then
            echo "editor state is tracked in git:"; echo "$bad"; exit 1
          fi
          echo "clean"

      - name: no absolute home paths in tracked files
        # The swap files leaked /Users/<name>/... paths. Nothing tracked here
        # should carry one; stdpath() and $HOME belong in the config instead.
        run: |
          bad=$(git grep -InE '/(Users|home)/[A-Za-z0-9._-]+/' -- . ':!README.md' || true)
          if [ -n "$bad" ]; then
            echo "absolute home paths found:"; echo "$bad"; exit 1
          fi
          echo "clean"

  # The point of this repo is that it comes with me -- macOS, bare Linux, a VM,
  # WSL2, native Windows. Whether setup.sh works on a platform I am not
  # currently sitting at is the one thing I cannot check for myself, so it is
  # the one thing worth a runner. macOS especially: stock bash there is 3.2,
  # sed is BSD, and ctags is a different program. Windows because it is the
  # only platform that does not keep its config in ~/.config and the only one
  # without usable symlinks -- this script got both wrong until someone
  # actually ran it there.
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Git Bash on the Windows runner, where the default shell is PowerShell.
    # setup.sh is bash and there is no second way to run it there; the other
    # two runners get bash either way.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: setup.sh installs, then agrees it installed
        # No plugins are installed and nvim is never started -- that is not
        # what this is testing. It asks whether the script runs to completion
        # on this platform and then verifies its own work.
        #
        # The config directory has to be worked out the same way setup.sh does
        # it, or the Windows leg installs somewhere nvim would never read and
        # the location check then fails -- correctly.
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) cfg="$(cygpath -u "$LOCALAPPDATA")/nvim" ;;
            *)                    cfg="$HOME/.config/nvim" ;;
          esac
          mkdir -p "$cfg"
          cp -r "$GITHUB_WORKSPACE" "$cfg/gitnvim"
          cd "$cfg/gitnvim"
          ./setup.sh
          ./setup.sh --check

      - name: --help renders (BSD sed vs GNU sed)
        # Run from the checkout: --help exits during argument parsing, before
        # anything looks at where the repo lives, so this needs no install.
        run: |
          ./setup.sh --help | tee help.txt
          if grep -q '^#' help.txt; then
            echo "comment markers survived -- the sed in --help is not portable"; exit 1
          fi
