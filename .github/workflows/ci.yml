name: ci

on:
  # push only. Everything here is pushed directly to this repo, so the push
  # event already covers any branch a PR is opened from -- `pull_request:` sat
  # alongside this until 2026-08 and did nothing but run the whole thing twice.
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # One job, no editor. Every check below is a regression test for something
  # that actually went wrong in this repo -- that is the bar for adding
  # another. A smoke job that installed neovim and booted it lived here
  # briefly; see README for why it went and what runs by hand instead.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck setup.sh
        run: shellcheck setup.sh

      - name: keymap collisions
        # mapleader is <space>, so every <space>x mapping is a <leader>x
        # mapping in disguise -- which is how <space>a shadowed <leader>a for
        # years with no error. Reads .vimrc and lua/init.lua both, because a
        # collision can span the two and neither file shows both sides.
        run: ./scripts/check-keymaps.py

      - name: no editor state is tracked
        # Regression test for the 2026-08 history scrub. Swap files, a ctags
        # index and netrw bookmarks were all committed at some point and
        # carried for years. .gitignore covers them now; this fails the build
        # if one is ever force-added past it.
        run: |
          bad=$(git ls-files | grep -E \
            '(^|/)(swapfiles|backupfiles|session)/|\.(swp|swo|un~)$|(^|/)\.vimtags$|(^|/)\.netrw(hist|book)$|(^|/)tags$|:Zone\.Identifier$|\.DS_Store$' \
            || true)
          if [ -n "$bad" ]; then
            echo "editor state is tracked in git:"; echo "$bad"; exit 1
          fi
          echo "clean"

      - name: no absolute home paths in tracked files
        # The swap files leaked /Users/<name>/... paths. Nothing tracked here
        # should carry one; stdpath() and $HOME belong in the config instead.
        run: |
          bad=$(git grep -InE '/(Users|home)/[A-Za-z0-9._-]+/' -- . ':!README.md' || true)
          if [ -n "$bad" ]; then
            echo "absolute home paths found:"; echo "$bad"; exit 1
          fi
          echo "clean"
